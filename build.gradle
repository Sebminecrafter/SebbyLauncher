plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://jitpack.io")
    }
}

dependencies {
    implementation "net.raphimc:MinecraftAuth:5.0.0"
    implementation "com.google.code.gson:gson:2.9.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass.set('io.github.sebminecrafter.SebbyLauncher.Main')
}

tasks.named('run') {
    workingDir = file("$project.projectDir/run")
}